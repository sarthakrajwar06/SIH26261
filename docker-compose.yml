# Optional OCR-equipped backend. Supabase remains hosted; no second PostgreSQL/Auth system.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256m
    mem_limit: 2g
    cpus: 2
    restart: "no"
